<section class="yb-square-page" data-yb-reference="square">
  <header class="yb-square-page__runtime-bar" aria-label="页面导航">
    <button type="button" data-runtime-action="back">返回</button>
    <button type="button" data-runtime-action="previousTable">上一张</button>
    <strong data-page-title>广场</strong>
    <button type="button" data-runtime-action="nextTable">下一张</button>
    <button type="button" data-runtime-action="editCurrentTable">编辑</button>
  </header>
  <p class="yb-square-page__action-status" data-action-status aria-live="polite"></p>
  <main class="yb-square-page__content" data-page-content></main>
  <aside class="yb-square-page__detail" data-square-detail hidden aria-live="polite">
    <div>
      <strong data-square-detail-title>媒体说明</strong>
      <button type="button" data-square-detail-close aria-label="关闭说明">×</button>
    </div>
    <p data-square-detail-body></p>
  </aside>
</section>
