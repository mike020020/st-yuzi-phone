<section class="yb-calendar-page" data-yb-reference="calendar">
  <header class="yb-calendar-page__runtime-bar" aria-label="页面导航">
    <button type="button" data-runtime-action="back">返回</button>
    <button type="button" data-runtime-action="previousTable">上一张</button>
    <strong data-page-title>小日历</strong>
    <button type="button" data-runtime-action="nextTable">下一张</button>
    <button type="button" data-runtime-action="editCurrentTable">编辑</button>
  </header>
  <p class="yb-calendar-page__action-status" data-action-status aria-live="polite"></p>
  <main class="yb-calendar-page__content" data-page-content></main>
</section>
